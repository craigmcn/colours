name: Test

on:
  pull_request:
  # Weekly run on main replaces the push-to-main run: branch protection requires
  # PRs to be up to date before merging, so main only gets tested code.
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

# A new push to a PR cancels its in-flight run; runs on main never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --immutable

      - run: yarn format:check

      - run: yarn test --run

      # bin/ is committed so git installs need no build; fail if it's stale.
      - name: Check committed CLI build is up to date
        # porcelain also catches new untracked files (e.g. a split-off chunk)
        run: |
          yarn build:cli
          if [ -n "$(git status --porcelain -- bin/)" ]; then
            git status --short -- bin/
            echo "::error::bin/ is stale: run 'yarn build:cli' and commit bin/"
            exit 1
          fi

      - name: Smoke-test the CLI
        run: node bin/colours-tokens.mjs theme --brand 3366cc --format json > /dev/null

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - run: yarn test:e2e
